{% extends "master.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center align-items-center" style="min-height: 65vh;">
        <div class="col-md-5 col-lg-4">

            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4 p-md-5 text-center">

                    <div class="mb-3">
                        <i class="bi bi-shield-lock text-primary"
                           style="font-size: 2.5rem;"></i>
                    </div>

                    <h4 class="fw-semibold mb-2">
                        Login
                    </h4>

                    <p class="text-muted mb-4">
                        Login using your Parichay account
                    </p>

                    <a href="{% url 'parichay_login' %}"
                       class="btn btn-primary w-100 py-2 rounded-3 fw-semibold">
                        <i class="bi bi-shield-check me-2"></i>
                        Login with Parichay
                    </a>

                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
